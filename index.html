<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Registro de Estudiantes</title>
    <!-- Pagina oficial Bootstrap: https://getbootstrap.com/docs/5.3/getting-started/introduction/ -->
    <!-- Link de donde se extrajo la pagina oficial de Bootstrap v5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4" style="max-width: 600px">

      <!-- fecha y hora actual -->
      <p id="fechaHora" class="text-end text-muted"></p>
      <h1 class="h3 mb-1">Formulario Registro de Estudiantes</h1>
      <p id="bienvenida" class="text-success mb-3"></p>

      <form id="formulario" class="card card-body mb-4">

        <!-- Apartado de Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" placeholder="Ingrese su Nombre"/>
          <div id="msgNombre" class="form-text"></div>
        </div>

        <!-- Apartado de Apellido -->
        <div class="mb-3">
          <label for="apellido" class="form-label">Apellido</label>
          <input type="text" id="apellido" class="form-control" placeholder="Ingrese su Apellido"/>
        </div>

        <!-- Apartado de Edad -->
        <div class="mb-3">
          <label for="edad" class="form-label">Edad</label>
          <input type="number" id="edad" class="form-control" min="0" placeholder="Ingrese su Edad"/>
          <div id="msgEdad" class="form-text"></div>
        </div>

        <!-- Apartado de Correo -->
        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="text" id="correo" class="form-control" placeholder="Ingrese su Correo Electronico"/>
          <div id="msgCorreo" class="form-text text-danger"></div>
        </div>

        <!-- Apartado de Programa Academico -->
        <div class="mb-3">
          <label for="programa" class="form-label">Programa académico</label>
          <input type="text" id="programa" class="form-control" placeholder="Ingrese lo que esta estudiando"/>
        </div>

        <!-- Botones para guardar y limpiar en el formulario -->
        <div class="d-flex gap-2">
          <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar</button>
          <button type="button" id="btnLimpiar" class="btn btn-secondary">Limpiar (doble clic)</button>
        </div>
      </form>

      <!-- Contenedor o tarjeta para los resultados -->
      <div id="resultado"></div>
    </div>
    <script src="form.js"></script>
    <!-- De aca se extrae el diseño del mensaje de Bienvenida por la pagina oficial : https://sweetalert2.github.io/ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
